name: Server (Rust)

on:
  pull_request:
    paths:
      - packages/server-rs/**
      - packages/ai/**
      - packages/http-recorder/**
      - bun.lock
      - package.json
      - packages/cli-rs/Cargo.toml
      - packages/cli-rs/Cargo.lock
      - packages/cli-rs/rust-toolchain.toml
      - packages/cli-rs/crates/local/**
      - packages/cli-rs/crates/util/**
      - packages/cli-rs/crates/api-types/**
      - packages/cli-rs/crates/api/**
      - packages/cli-rs/crates/service/**
      - packages/cli-rs/script/rust/types.ts
      - packages/core/src/database/**
      - packages/core/src/kv*
      - packages/core/src/project/sql.ts
      - packages/cli/src/database-path.ts
      - packages/schema/src/identifier.ts
      - .github/workflows/check-server-rs.yml
  push:
    branches: [dev]
    paths:
      - packages/server-rs/**
      - packages/ai/**
      - packages/http-recorder/**
      - bun.lock
      - package.json
      - packages/cli-rs/Cargo.toml
      - packages/cli-rs/Cargo.lock
      - packages/cli-rs/rust-toolchain.toml
      - packages/cli-rs/crates/local/**
      - packages/cli-rs/crates/util/**
      - packages/cli-rs/crates/api-types/**
      - packages/cli-rs/crates/api/**
      - packages/cli-rs/crates/service/**
      - packages/cli-rs/script/rust/types.ts
      - packages/core/src/database/**
      - packages/core/src/kv*
      - packages/core/src/project/sql.ts
      - packages/cli/src/database-path.ts
      - packages/schema/src/identifier.ts
      - .github/workflows/check-server-rs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: packages/server-rs

env:
  CARGO_DENY_VERSION: 0.22.0

jobs:
  check:
    name: Check
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: packages/server-rs -> target
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace --no-fail-fast

  licenses:
    name: Licenses
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version "$CARGO_DENY_VERSION"
      - run: cargo fetch --locked
      - run: cargo deny --workspace --frozen check --hide-inclusion-graph licenses bans sources

  drift:
    name: Drift
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: bun run check:drift
      - run: bun run check:interop

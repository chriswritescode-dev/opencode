# `cargo deny check` for the server's dependency tree, on every target. `licenses`, `bans` and `sources` read only
# the lock file and the crates cargo has fetched (`bun run check:deny`); `advisories` fetches the RustSec database
# (`bun run check:advisories`). The server binary and the `opencode-ai` runtime crate pull the HTTP, TLS and socket
# stack (hyper, tokio, ring, rustix and the rest), and the licence check covers the whole `Cargo.lock` tree,
# including the test-only crates.

[advisories]
# A vulnerability fails, and so does a crate marked unmaintained, unsound or yanked: each is read, then ignored here
# with its reason.
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
# The workspace crates and their dependencies are checked, and development-only crates are included, so the licence
# check covers the test tree too.
include-dev = true
# The licences the tree needs today, each with the crates that need it. A crate passes when these satisfy its
# expression: `MIT OR Apache-2.0` needs either, `Apache-2.0 AND ISC` both.
allow = [
    # Most crates, the workspace's own, tokio, serde, flate2, crc32fast, adler2, simd-adler32, the brotli crates and
    # the hyper/tower stack behind reqwest. rusqlite, libsqlite3-sys (which vendors the bundled SQLite) and hashlink
    # are MIT too.
    "MIT",
    # ring (with ISC) and sync_wrapper; reqwest, rustls, tokio-tungstenite, flate2, crc32fast and most others offer it
    # beside MIT.
    "Apache-2.0",
    # subtle, brotli, brotli-decompressor, alloc-no-stdlib and alloc-stdlib.
    "BSD-3-Clause",
    # notify.
    "CC0-1.0",
    # webpki-root-certs, the Mozilla root certificates.
    "CDLA-Permissive-2.0",
    # inotify, inotify-sys, ring, rustls-webpki and untrusted.
    "ISC",
    # unicode-ident's Unicode tables.
    "Unicode-3.0",
    # foldhash, miniz_oxide and flate2's zlib-rs backend.
    "Zlib",
]

[bans]
# Duplicate crate versions are reported, not failed.
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between workspace crates carry no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[package]
name = "opencode-ai"
description = "The LLM layer: protocols, routes, transports and their recorded corpus."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[lints]
workspace = true

[dependencies]
opencode-api-types.workspace = true
opencode-contract.workspace = true
opencode-util = { workspace = true, features = ["ring"] }
base64.workspace = true
bytes.workspace = true
futures-util.workspace = true
percent-encoding.workspace = true
regex-lite.workspace = true
reqwest.workspace = true
ring.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
url.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[[test]]
name = "all"
path = "tests/all/main.rs"

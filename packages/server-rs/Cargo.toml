[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
dbg_macro = "deny"
todo = "warn"
undocumented_unsafe_blocks = "deny"

[workspace.dependencies]
opencode-ai = { path = "crates/ai" }
opencode-bus = { path = "crates/bus" }
opencode-catalog = { path = "crates/catalog" }
opencode-config = { path = "crates/config" }
opencode-contract = { path = "crates/contract" }
opencode-fs = { path = "crates/fs" }
opencode-git = { path = "crates/git" }
opencode-http = { path = "crates/http" }
opencode-location = { path = "crates/location" }
opencode-permission = { path = "crates/permission" }
opencode-plugin = { path = "crates/plugin" }
opencode-registry = { path = "crates/registry" }
opencode-server = { path = "crates/server" }
opencode-sidecar = { path = "crates/sidecar" }
opencode-session = { path = "crates/session" }
opencode-storage = { path = "crates/storage" }
opencode-tool = { path = "crates/tool" }
opencode-vcs = { path = "crates/vcs" }
opencode-api-types = { path = "../cli-rs/crates/api-types" }
opencode-api = { path = "../cli-rs/crates/api" }
opencode-local = { path = "../cli-rs/crates/local" }
opencode-util = { path = "../cli-rs/crates/util" }
opencode-service = { path = "../cli-rs/crates/service" }
base64 = "0.23"
brotli = "9"
bytes = "1"
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
http = "1"
http-body = "1"
httpdate = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
indexmap = "2"
log = { version = "0.4", features = ["std"] }
notify = "8"
percent-encoding = "2"
rand = "0.10"
regex-lite = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
ring = "0.17"
rusqlite = { version = "0.43", default-features = false, features = ["bundled", "cache"] }
rustix = { version = "1", features = ["system", "process", "fs"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order", "raw_value"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1.53", features = ["macros", "rt", "rt-multi-thread", "net", "time", "signal", "io-util", "io-std", "sync", "process", "fs"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
tokio-util = "0.7"
ts-rs = { version = "12", default-features = false, features = ["serde-compat", "serde-json-impl", "no-serde-warnings"] }
unicode-segmentation = "1"
url = "2"
yaml-rust2 = "0.13"

[profile.dev]
debug = "line-tables-only"

[profile.release]
debug = "line-tables-only"

# cli-rs deviation A10-ascii-hosts: the lock takes cli-rs's `idna_adapter = "=1.0.0"` ASCII-only stub through opencode-api.
[profile.dev.package.idna]
debug-assertions = false

# Same A10-ascii-hosts stub: `idna` instantiates `idna_adapter`.
[profile.dev.package.idna_adapter]
debug-assertions = false

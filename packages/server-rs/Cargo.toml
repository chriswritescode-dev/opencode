[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
dbg_macro = "deny"
todo = "warn"
undocumented_unsafe_blocks = "deny"

[workspace.dependencies]
opencode-contract = { path = "crates/contract" }
opencode-http = { path = "crates/http" }
opencode-server = { path = "crates/server" }
opencode-api-types = { path = "../cli-rs/crates/api-types" }
opencode-local = { path = "../cli-rs/crates/local" }
opencode-util = { path = "../cli-rs/crates/util" }
opencode-service = { path = "../cli-rs/crates/service" }
base64 = "0.23"
brotli = "9"
bytes = "1"
flate2 = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rand = "0.10"
regex-lite = "0.1"
ring = "0.17"
rustix = { version = "1", features = ["system", "process", "fs"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order", "raw_value"] }
subtle = "2"
tokio = { version = "1.53", features = ["macros", "rt", "rt-multi-thread", "net", "time", "signal", "io-util", "io-std", "sync", "process", "fs"] }
url = "2"

[profile.dev]
debug = "line-tables-only"

[profile.release]
debug = "line-tables-only"

# cli-rs deviation A10-ascii-hosts: the lock takes cli-rs's `idna_adapter = "=1.0.0"` ASCII-only stub through opencode-api.
[profile.dev.package.idna]
debug-assertions = false

# Same A10-ascii-hosts stub: `idna` instantiates `idna_adapter`.
[profile.dev.package.idna_adapter]
debug-assertions = false
